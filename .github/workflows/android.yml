name: Android build

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # necesario para publicar los APK en Releases al crear un tag v*/V*

jobs:
  build:
    # Versión fija: ubuntu-latest cambia de imagen sin aviso (migración a Ubuntu 26 en curso).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # El runner ya trae el Android SDK; esto añade caché de Gradle.
      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar APKs debug (uno por arquitectura)
        run: ./gradlew assembleDebug --stacktrace

      # Un artifact por arquitectura para no descargar los tres juntos.
      - uses: actions/upload-artifact@v7
        with:
          name: VideoDownloader-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: VideoDownloader-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: VideoDownloader-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error

      - name: Publicar en Releases (solo tags v*/V*)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/*.apk
